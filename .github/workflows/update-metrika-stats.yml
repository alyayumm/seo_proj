name: Update Yandex Metrika stats

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: write

concurrency:
  group: metrika-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Yandex Metrika stats
        run: node scripts/fetch-metrika-stats.mjs
        env:
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          METRIKA_COUNTER_MAP: ${{ secrets.METRIKA_COUNTER_MAP }}
          METRIKA_PROJECTS: ${{ secrets.METRIKA_PROJECTS }}
          METRIKA_DATE1: ${{ vars.METRIKA_DATE1 }}
          METRIKA_DATE2: ${{ vars.METRIKA_DATE2 }}

      - name: Commit stats
        run: |
          if [ -z "$(git status --porcelain public/data/metrika-stats.json)" ]; then
            echo "No Metrika stats changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/metrika-stats.json
          git commit -m "chore: update metrika stats"
          git push
