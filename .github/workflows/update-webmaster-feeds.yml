name: Update Yandex Webmaster feeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-webmaster-feeds.yml'
      - 'scripts/fetch-webmaster-feeds.mjs'
  schedule:
    - cron: '35 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: webmaster-feeds
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch Yandex Webmaster feeds
        run: node scripts/fetch-webmaster-feeds.mjs
        env:
          WEBMASTER_OAUTH_TOKEN: ${{ secrets.WEBMASTER_OAUTH_TOKEN }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          WEBMASTER_PROJECTS: ${{ vars.WEBMASTER_PROJECTS }}

      - name: Commit Webmaster feeds
        run: |
          if [ -z "$(git status --porcelain public/data/webmaster-feeds.json)" ]; then
            echo "No Webmaster feeds changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/webmaster-feeds.json
          git commit -m "chore: update webmaster feeds"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
