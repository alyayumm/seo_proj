name: Update Yandex Metrika stats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-metrika-stats.yml'
      - 'scripts/fetch-metrika-stats.mjs'
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: metrika-stats
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Yandex Metrika stats
        run: node scripts/fetch-metrika-stats.mjs
        env:
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          METRIKA_COUNTER_MAP: ${{ secrets.METRIKA_COUNTER_MAP }}
          METRIKA_PROJECTS: ${{ secrets.METRIKA_PROJECTS }}
          METRIKA_DATE1: ${{ vars.METRIKA_DATE1 }}
          METRIKA_DATE2: ${{ vars.METRIKA_DATE2 }}
          METRIKA_QUERY_ROW_LIMIT: ${{ vars.METRIKA_QUERY_ROW_LIMIT }}
          METRIKA_QUERY_PAGE_SIZE: ${{ vars.METRIKA_QUERY_PAGE_SIZE }}

      - name: Commit stats
        run: |
          if [ -z "$(git status --porcelain public/data/metrika-stats.json)" ]; then
            echo "No Metrika stats changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/metrika-stats.json
          git commit -m "chore: update metrika stats"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
